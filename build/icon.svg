<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3b5a8"/>
      <stop offset="100%" stop-color="#a8968a"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d855"/>
      <stop offset="100%" stop-color="#e8bb1f"/>
    </linearGradient>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a4a3f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景：棋盘米色 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 2048 方块：金色 -->
  <rect x="68" y="68" width="376" height="376" rx="76" fill="url(#tileGrad)" filter="url(#ds)"/>

  <!-- 文字 -->
  <text x="256" y="305" text-anchor="middle"
        font-family="Segoe UI, Segoe UI Variable, Helvetica Neue, Arial, sans-serif"
        font-size="136" font-weight="800" letter-spacing="-6"
        fill="#ffffff">2048</text>
</svg>